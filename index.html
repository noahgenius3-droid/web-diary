<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply saved theme before paint to avoid a flash
        try {
            const t = localStorage.getItem('diaryTheme');
            if (t) document.documentElement.dataset.theme = t;
        } catch (e) {}
    </script>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg>
                </span>
                <span class="brand-name">My Diary</span>
            </div>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle theme">
                <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </button>
        </header>

        <section class="hero">
            <p class="today" id="today"></p>
            <h1 id="greeting">Good day.</h1>
            <div class="stats">
                <div class="stat"><span class="stat-value" id="stat-entries">0</span><span class="stat-label">entries</span></div>
                <div class="stat"><span class="stat-value" id="stat-words">0</span><span class="stat-label">words</span></div>
                <div class="stat"><span class="stat-value" id="stat-streak">0</span><span class="stat-label">day streak</span></div>
            </div>
        </section>

        <section class="composer" aria-label="New entry">
            <textarea id="note-input" placeholder="What's on your mind today?" rows="4"></textarea>
            <div class="composer-footer">
                <div class="moods" role="radiogroup" aria-label="Mood">
                    <button class="mood" data-mood="happy" role="radio" aria-checked="false" title="Happy">😊</button>
                    <button class="mood" data-mood="calm" role="radio" aria-checked="false" title="Calm">😌</button>
                    <button class="mood" data-mood="thoughtful" role="radio" aria-checked="false" title="Thoughtful">🤔</button>
                    <button class="mood" data-mood="sad" role="radio" aria-checked="false" title="Sad">😔</button>
                    <button class="mood" data-mood="stressed" role="radio" aria-checked="false" title="Stressed">😤</button>
                </div>
                <div class="composer-actions">
                    <span class="word-count" id="word-count">0 words</span>
                    <button id="save-btn" class="primary-btn" disabled>
                        Save entry
                        <kbd>Ctrl ↵</kbd>
                    </button>
                </div>
            </div>
        </section>

        <section class="entries">
            <div class="entries-toolbar">
                <h2>Entries</h2>
                <label class="search">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="search-input" placeholder="Search entries" aria-label="Search entries">
                </label>
            </div>
            <div id="notes-list" class="notes-list"></div>
        </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toast-text"></span>
        <button id="toast-undo" class="toast-undo">Undo</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
