<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Cordial Command Center</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cc.css?v=1">
    <script>
        // Theme before first paint (saved choice, else the system's)
        (function () {
            try { var t = localStorage.getItem('cc-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
        })();
    </script>
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app" class="app" aria-busy="true">
        <div class="boot" role="status"><span class="spin" aria-hidden="true"></span>Opening the Command Center…</div>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
